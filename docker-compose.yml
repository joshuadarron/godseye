services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-godseye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-godseye}
      POSTGRES_DB: ${POSTGRES_DB:-globaltracker}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    # Without this, `docker compose up -d` returns as soon as the container is
    # created — not when Postgres accepts connections. Both Go services exit 1
    # if they can't connect, so anything launching them needs `--wait`.
    #
    # -h 127.0.0.1 forces a TCP check. Without it pg_isready succeeds against
    # the unix-socket-only temporary server that initdb runs during first boot,
    # and dependents start against a database that is about to be restarted.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-godseye} -d ${POSTGRES_DB:-globaltracker}',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  memgraph:
    image: memgraph/memgraph-platform:latest
    ports:
      - '7687:7687'
      - '7444:7444'
    volumes:
      - memgraph_data:/var/lib/memgraph
    environment:
      MEMGRAPH_USER: memgraph
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD:-memgraph}
    # Memgraph is optional — the API logs "memgraph not reachable, graph layer
    # disabled" and keeps running. Nothing may gate on this healthcheck, and
    # `docker compose up --wait` must name timescaledb/redis explicitly rather
    # than waiting on every service, or a stuck Memgraph blocks the whole stack.
    #
    # The previous check shelled out to `nc`, which this image does not ship —
    # it reported unhealthy forever. bash's /dev/tcp needs no extra binary.
    healthcheck:
      test: ['CMD-SHELL', "timeout 3 bash -c '</dev/tcp/127.0.0.1/7687' || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 20s

volumes:
  timescaledb_data:
  memgraph_data:
